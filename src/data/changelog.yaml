    - API：/api/v1/scenarios/{id}.json 的 picks.free 增加 base_family 字段，base_variant 标注为排序依据；端点描述同步；场景页 FAQ 文案与方法论 FREE 规则措辞同步
    - 展示层与语义修正，排名算法未动；构建校验通过

- id: cl-2026-09-06-webdev-top20
  date: 2026-09-06
  title: WebDev 榜采集扩展至前 20（官方截图交叉验证）；DeepSeek V4 系与 GPT-5.6 Sol 获编码信号
  entries:
    - 交叉验证：用户提供的 arena.ai WebDev 官方截图与本站既有采集（ev-webdev-001…010）逐项核对完全一致（名次与 Elo），采集准确性获独立确认
    - 采集扩展：WebDev 榜 11–20 名入库（ev-webdev-011…020）——gpt-5.6-sol-xhigh #13（编码维度自此双信号且两仪器一致：编码类目 #14 + WebDev #13）、muse-spark-1.3-xhigh #11（新变体入榜）、hy4-preview #12、glm-5.2-max #18、qwen3.8-27b #16、deepseek-v4-pro-high #19 / v4-flash-high #20（DeepSeek V4 系获首个能力证据）
    - 效果：muse-spark-1.3-xhigh 综合榜 #15（编码 78.4）；gpt-5.6-sol-xhigh 编码维度 73.5（双信号收敛、误差收窄）；DeepSeek V4 系进入综合榜（v4-pro-high #38、v4-flash-high #40，置信度低——单信号新实体）；ide-coding 性价比档仍为 claude-haiku-4-5（SWE 66.6% × 价格比上限 2），DeepSeek V4 Flash High 因价格证据挂在非 high 变体上暂不入性价比档（不做变体合并猜测，待官方价核实）
    - 构建校验通过；在榜变体 66 个

- id: cl-2026-09-06-swe-fullset-benchlm
  date: 2026-09-06
  title: SWE-bench 官方可比集补全（浏览器采集 47→全集）；BenchLM 判定不入白名单；Agent 榜口径变更标注
  entries:
    - 浏览器采集首跑成功（响应待办①）：swebench.com JS 渲染表经浏览器全量提取，bash-only 官方可比集（mini-SWE-agent）共 47 个模型，本站由 15 条补齐至全集（新增 16 条证据，每变体取最新运行）——区间型 z-score 的 SWE 参考系自此完整；claude-haiku-4-5、gemini-2.5-pro、gpt-5.1 系等获得能力证据（haiku 等进入性价比档候选）
    - 关键事实：GPT-6 / GPT-5.6 / Claude Fable 5.1 均不在 SWE 官方可比集（最新官方运行 2026-02-26，早于其发布）——SWE-bench 暂无法为当前旗舰提供证据，其编码位次由 arena（编码/WebDev）与 AA 承载；官方集榜首 Claude 4.5 Opus high 76.8 与既有采集一致
    - BenchLM 判定：不入白名单（响应待办②）。核查其首页：证据标注「3 source families」、数据 credit 指向 AA、无运营方信息、方法论页未公开呈现——聚合站而非自研评测，来源责任无法追溯，与白名单「可回查原始出处」原则冲突
    - Agent 榜接入评估：暂缓（响应待办③）。来源站 2026-09 起改用胜率口径，与库内净改进率口径冲突（混用破坏跨模型可比性），且证据仅 10 条、场景 schema 未含 agent 维度；Agent 分榜冻结更新并标注口径变更，待口径稳定且覆盖 ≥15 模型后人工评估新增 arena_agent_winrate
    - 收尾：board.ts Agent 榜描述加口径变更标注；sync.mjs swebench notes 更新（浏览器采集已验证）；构建校验通过，在榜变体 61、编码维度实体 73

- id: cl-2026-09-06-gpt6-webdev-tier2
  date: 2026-09-06
  title: GPT-6 升至 #6：注册 Arena WebDev 榜信号；AA 指数按自研评测性质升为 tier 2；价格/上下文入账
  entries:
    - 持续追踪（响应「GPT-6 排名明显太低」反馈）：GPT-6 Astra（9 月 3 日发布）已登 arena WebDev 榜第 1（Elo 1797±24）——Text 总榜仍未收录，但编码能力有了 arena 侧信号
    - 指标注册（经用户连续反馈确认）：新增 arena_rank_webdev（编码维度第三信号，cohort_size 50，tier 2）——编码维度升级为「编码类目盲测 + WebDev 盲测 + SWE-bench」三信号
    - 口径修正：aa_intelligence_index 由 tier 3 升 tier 2——AA 智能指数为自研评测集（AA-Briefcase、τ³-Banking、Terminal-Bench 等，含私有 held-out 防污染），性质与 LMArena/SWE-bench 同为独立基准，非聚合转载；AGENTS.md 白名单与方法论页同步（AA 转载的价格/速度仍按 tier 3 交叉参考对待）
    - 数据入账：WebDev 榜前 10（gpt-6-astra-max #1、fable-5.1-max #2、opus-5-max #3、qwen3.8-max-0902 #4、kimi-k3-max #5、grok-4.6-high #10，ev-webdev-001…010）；GPT-6 价格 $10/$50 与 1M 上下文窗口自 AA 模型详情页入账（AA 转载官方价，官方 token 定价页迁移中待 tier-1 核实；context_window_k 缺口首条数据）
    - 效果：gpt-6-astra-max 由 #17 升至 #6（79.7，置信度中，90% 区间 [66.1, 93.2] 与 #2–5 重叠显示 ≈ 并列）；fable-5.1-max 升至 #5（80.7）——其 WebDev #2 与编码类目 #34 的仪器分歧以宽区间诚实呈现；全部变动由新增证据推动，无任何手工调分。构建校验通过
    - 待人工决策不变：SWE-bench 浏览器采集（补 GPT-5.6/6 独立基准）/ BenchLM 白名单审批 / Agent 榜维度接入

- id: cl-2026-09-06-gpt6-multisource
  date: 2026-09-06
  title: 全网调研后接入多源能力融合：GPT-6 Astra 入榜（AA 通道）；固定前沿参考系；知情先验
  entries:
    - 全网调研（响应「榜单不客观/缺 GPT-6/5.6 应靠前」反馈）：确认 GPT-6 Astra 已发布——AA 智能指数 v4.2 第 2（max 55）/第 3（xhigh 54），BenchLM 9 月榜第 2，arena.ai 尚未收录（单一 arena 源对新旗舰系统性迟到）；GPT-5.6 已被 AA 下架（被 6 代取代），其在 arena 文本总榜列第 17、Agent 榜第 4；多源第一梯队：Fable 5.1 (57) > GPT-6 Astra (55/54) = Opus 5 (54/53) > Kimi K3 (50) > GLM-5.3 (49) > Qwen3.8 (47)。调研结论沉淀 docs/research-2026-09.md 增补节
    - 指标注册（经用户反馈确认）：新增 aa_intelligence_index（tier 3 / 60 天窗口 / plausible [0,100]），采集 AA v4.2 前八名 8 条证据——通用维度升级为「arena Elo + arena 名次 + AA 指数」三信号可靠度加权；AA 同时作为新模型先行通道（arena 收录 GPT-6 前先入榜、低置信度展示）；sync.mjs AA 来源改指 /models 页
    - 算法修正一（名次百分位漂移）：arena 名次型指标引入固定前沿参考系 cohort_size=50（metrics 注册 + schema 字段），百分位 = f(名次, R) 而非 f(名次, 已采集条数)——修复「多采 17 个模型导致编码 #3 从 85.7 漂到 92.9」的采集扩围漂移，同一名次永远同一分数
    - 算法修正二（知情先验）：缺失维度收缩的先验由固定 50 升级为 50 + (自身实测均值 − 50) × 可靠度(来源层级×样本量)，夹 [30,70]——AA 第 2 的新模型不再被缺数据拖成中游，单基准模型也不因盲先验虚高（先验随证据可靠度回落）
    - 勘误核实：claude-fable-5.1-max 的 arena 编码名次 #34 经三向定向抓取核实为真实数据（其 Math 列为空，提取器可正确区分）——AA 全榜第 1 与 arena 编码 #34 属真实仪器分歧，榜单以依据列并示两信号；同轮核实 fable-5 写作 #1
    - 效果：GPT-6 Astra max 入榜（#17 / 68.8 / 置信度低 / 90% 区间 [47.8, 89.7]，通用维度 AA 单源 78.1）；在榜变体 61 个；模型库 GPT 条目更新为 GPT-6 Astra 现役；榜单页综合面板增加新模型通道说明；构建校验通过
    - 待人工决策（已具备条件，未擅动）：① SWE-bench 官网 JS 渲染表需浏览器采集，可补 GPT-5.6/6 的独立基准数据；② BenchLM 等聚合站进入来源白名单需人工审批（当前仅交叉参考）；③ Arena Agent 榜（sol-xhigh 第 4）接入评分维度待人工确认

- id: cl-2026-09-05-gpt-coverage
  date: 2026-09-05
  title: 补齐 GPT/多厂商覆盖：注册 arena_rank_overall，GPT 全系当前代次入榜（响应「榜单缺 GPT」反馈）
  entries:
    - 指标注册（经用户反馈确认，人工审批路径）：新增 arena_rank_overall——Text 总榜 Overall 名次（tier 2 / 90 天窗口 / direction lower / 合理域 [1,400]）。根因：arena 页面仅前 10 名展示 Elo 数值且无 GPT 模型进前 10，旧指标体系下 GPT 系列完全无法进入通用维度与综合分（通用分榜 0 个 GPT），「综合榜看不到 GPT」实为覆盖缺口而非排序错误
    - 采集：Arena 总榜名次 1–47 连续区块 + GPT 全系当前代次（sol-xhigh 总榜 #17 / 5.5-high #19 / 5.5 #24 / 5.4-high #25 / 5.2-chat #26 / terra-xhigh #43 等 11 个变体的总榜/编码/写作名次），新增证据 89 条；一并入册 32–47 名的 grok-4.5 / grok-4.20 系 / glm-5.1 / glm-5.2-max / ernie-5.1 / claude-sonnet-4-6 / claude-opus-4-8 / qwen3.5·3.7 preview / mimo-v2.5-pro；新模型家族 mimo 按 muse-spark 先例入 models.yaml（vendor 待核实）
    - 勘误留痕：claude-fable-5 写作名次三次抓取不一致（2/2/1），定向复核取 1，证据 notes 记录勘误过程
    - 工程修复：models.yaml 中「总榜 #N」的 # 触发 YAML 行内注释——字段被静默截断、新增 mimo 条目语法报错；全部改为「第 N 名」措辞并加解析校验。历史被截断条目（claude/gemini/glm/grok/hunyuan/gpt 的 current_version）一并修复
    - 效果：GPT 11 个变体进入综合榜（gpt-5.6-sol-xhigh #10 / 67.9 / 置信度高；gpt-5.5-high #22；gpt-5.2-codex·high 依 SWE 证据居中位），通用分榜 8 个 GPT 变体；在榜变体 59 个（+22）、15 个家族全覆盖。名次由 arena 数据驱动：GPT 文本总榜 17–46 名对应中低位次；sol-xhigh 的 Agent 榜第 4 未计入（agent 维度未接入评分，接入待人工确认）。构建校验通过，无过期指标

- id: cl-2026-09-05-arena-sync-zscore-tabs
  date: 2026-09-05
  title: 采集 2026-09-05 Arena 快照（+17 变体入榜）；区间型指标改 z-score 归一化；榜单页 tab 化
  entries:
    - 采集（响应「榜单数据不全」反馈）：arena.ai/leaderboard 2026-09-05 快照，新增证据 52 条（ev-arena-080…131）——新变体 17 个入榜（claude-fable-5.1-max 总榜 #3/写作 #6、gemini-3.8-flash-high 总榜 #8/编码 #7、glm-5.3-flash 编码 #9、gpt-5.5 与 gpt-5.5-high、kimi-k3-max 写作名次等），35 条既有名次/Elo 刷新（opus-4-7-high 升编码 #1 等）；models.yaml 同步 claude/gemini/glm/qwen/grok/hunyuan 的 current_version 与 strengths（附 arena.ai 来源，hy4-preview/grok-4.6/qwen-0902 标待核实）。GPT-6 未见于 arena 榜（页面最新系列为 GPT-5.6，terra-xhigh #43 无公开 Elo 值未入库）；SWE-bench 官网为 JS 渲染表，本轮未能自动采集，sync 已标记待浏览器采集
    - 算法（响应「gemini-3-flash-high 虚高」反馈，归因：区间型指标用名次百分位丢失量级——SWE 榜首集群 76.8% vs 75.8% 仅差 1 分，名次百分位却差出 6 个百分位）：归一化改双轨制，序数型（Arena 分类目名次）保留 Beta 后验百分位，区间型（Elo/解决率/价格，价格先取对数）改 z-score → 正态 CDF（delta 法标准误，z 温缩 ±2.6，n<4 回退 Beta）；方法论页与 docs/research-2026-09.md 同步更新
    - 修复效果：综合榜 gemini-3-flash-high 由 #7 左右降至 #8（62.3 [38.4, 86.3]，低置信度），编码榜前 3 回归多证据模型（opus-4-7-high 95.2 / opus-4-5-high 93.0 / opus-4-6-high 90.5），量级并列的 SWE 集群（gpt-5.2-codex = glm-5-high = gpt-5.2-high 52.4）正确显示为 ≈ 并列；编码榜新增 SWE 口径提示（官方运行 2026-02 早于部分当前旗舰，单项名次结合「依据」列解读）
    - 页面（响应「不要上下堆叠」反馈）：榜单页改 tab 切换——综合 / 通用 / 编码 / 写作 / 长上下文 / Agent / 来源镜像 七个面板，#hash 深链直达（/leaderboards/#coding），无框架原生 JS 实现、aria tablist 语义、面板全在 DOM（SEO 不受损）；移动端 tab 栏横向滑动
    - 视觉验收：judge 三审 4/4 通过（桌面综合/编码/长上下文三态 + 390px 移动端真机仿真）；另核实移动端「导航溢出」前判为无头 Chrome 最小窗宽钳制伪影，真实 390px 布局无溢出
    - 排名影响：z-score 重算全站分数（综合榜头部 fable-5 91.9 / opus-4-6-high 91.1 / opus-4-7-high 86.5）；37 个变体在榜（+14），14 个仅价格证据变体维持不入榜；场景权重与正文未动；构建、鲜度校验通过（缺口仅 context_window_k，维持待人工）

- id: cl-2026-09-05-credibility-engine
  date: 2026-09-05
  title: 可信度升级：Beta 后验百分位 + 90% 误差界 + 经验贝叶斯收缩；Agent JSON API/Skill；一键同步
  entries:
    - 行业调研沉淀 docs/research-2026-09.md（LMArena、Artificial Analysis、HELM、SWE-bench、LiveBench、OpenRouter、OpenCompass、RouteLLM 等 15+ 项目与 BT/Elo 置信区间、加权算术平均、经验贝叶斯收缩、Glicko 式时效等方法），scoring.ts 每项算法选型逐条注明依据
    - 归一化改用 Beta 后验百分位：裸百分位在旧数据上产生大面积饱和 100 分（旧算法 13 个场景中 8 个 TOP=100.0），新算法头部约 93 且天然携带标准误；同日冲突证据改取中位数入分（与告警文案一致）
    - 维度聚合改可靠度加权（来源层级 × 时效衰减 × 一致性）；新增沿 归一化→维度→场景 逐层合成的 90% 误差界，页面与 API 全部展示「分数 ±区间」，区间重叠的相邻名次标记「≈ 并列」
    - 稀疏证据经验贝叶斯收缩：实体缺失的维度（全站有数据时）按先验 50±28.9 计入——修复单基准证据模型凭一条强数据以假满分登顶（旧算法 ide-coding/agent-coding/code-review/prototyping 的 TOP 即此假象）；全站无数据维度不参与评分，避免整体压缩
    - 置信度改 5 因子：覆盖率 × 来源层级 × 样本量 min(1,n/10) × 时效 1−0.2×(age/窗口) × 一致性；阈值调整为 高≥0.7 / 中≥0.4
    - 性价比分修复：只考虑有真实能力证据（非价格）的变体并改用实测适配分（不含先验收缩），此前纯价格证据变体以「先验 50 × 价格比上限 2」满分齐平、档位无信息量
    - Agent 通道：新增 /api/v1/{index,models,evidence,all}.json 与 /api/v1/scenarios/:id.json（静态 JSON、CORS 全开、自描述 schema_version/generated_at/data_as_of）+ /skill.md（agentskills.io 规范，场景清单构建时注入，源文件 skills/fitmodel-model-pick/SKILL.md）+ /api/ 文档页；llms.txt / llms-full.txt 增加通道索引与误差界
    - 一键同步：npm run sync（scripts/sync.mjs）= 鲜度巡检 + 白名单来源内容哈希变更检测（HTTP 源自动、JS 渲染源标记需浏览器）+ 采集任务卡（含写入模板，--json 供 agent 程序化消费）+ 排名影响对比（rank 快照存 scripts/.cache/，已 gitignore）；AGENTS.md 采集流程改以 sync 为入口并加「最小操作卡」
    - 页面改版：榜单页改为「综合能力指数（权重公示 40/30/20/10）+ 通用/编码/写作/长上下文分榜 + Agent 榜（仅展示）+ 原始镜像折叠」，全表带分数条与误差须；首页加综合榜 Top5 速览条、Agent 接入横幅、卡片内嵌适配分；场景页直接回答与排名表带误差界/并列标记及机器可读链接；模型页改综合+维度分列；方法页公式与行业对照重写
    - 排名影响（旧→新 TOP）：ide-coding/agent-coding/code-review claude-opus-4-5-high(100) → claude-opus-4-7-high(89.1–89.3)；prototyping claude-opus-4-5-high(100) → claude-opus-4-6-high(86.2)；spreadsheets claude-opus-4-5-high(100) → claude-fable-5(88.9)；其余 9 场景 TOP 保持 claude-fable-5 但分数由饱和 100.0 回落至 88.9–93.3；VALUE 由 gemini-3.1-pro-preview / claude-opus-4-6 等有据变体按场景区分（此前部分场景被纯价格变体占据）；FREE 档规则未动。场景权重与正文未动；构建校验通过
    - OG 分享图重生成（榜单/模型库文案更新）；check:freshness 全绿（仅 context_window_k 缺口，维持现状待人工）

