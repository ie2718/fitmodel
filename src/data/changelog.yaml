    - 颜色克制：全页仅三个语义色点（朱红=最强、绿=免费、墨色=悬停描边），无渐变、无阴影、卡片直角
    - 纯展示层重构：数据、权重、排名计算未动，推荐结论与改版前完全一致
    - 浏览器实测（880px / 375px）：无横向溢出、无重叠、长模型名无破版，暗色模式沿用全局变量

- id: cl-2026-08-22-sync-mechanism
  date: 2026-08-22
  title: 建立每周定期同步机制；新增鲜度巡检命令
  entries:
    - 新增 `npm run check:freshness`（scripts/check-freshness.mjs）：按指标报告最新采集日期、时效窗口余量、待人工抽查条数；任何指标超过 freshness_days 即非零退出，可作定时同步与 CI 的门禁
    - AGENTS.md 新增「定期同步机制」章节并改造采集流程（增加步骤 0 巡检 / 步骤 6 复核）：每周一 09:00 自动同步白名单全部来源，触发式采集不受周期限制；促销价到期前一周复核
    - 创建每周一 09:00 的维护 agent 定时任务，自动执行完整采集流程（巡检 → 采集 → 写证据 → 构建 → 波及分析 → 留痕 → 复核）
    - 当前巡检基线：8 个注册指标中 7 个有据且全部新鲜，1 个缺口（context_window_k 零证据，待人工决定补采或降级），94 条证据待人工抽查置 verified
    - 纯流程与工具变更，未改评分数据，排名无变化

