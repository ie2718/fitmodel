# 更新日志

- id: cl-2026-09-05-credibility-engine
  date: 2026-09-05
  title: 可信度升级：Beta 后验百分位 + 90% 误差界 + 经验贝叶斯收缩；Agent JSON API/Skill；一键同步
  entries:
    - 行业调研沉淀 docs/research-2026-09.md（LMArena、Artificial Analysis、HELM、SWE-bench、LiveBench、OpenRouter、OpenCompass、RouteLLM 等 15+ 项目与 BT/Elo 置信区间、加权算术平均、经验贝叶斯收缩、Glicko 式时效等方法），scoring.ts 每项算法选型逐条注明依据
    - 归一化改用 Beta 后验百分位：裸百分位在旧数据上产生大面积饱和 100 分（旧算法 13 个场景中 8 个 TOP=100.0），新算法头部约 93 且天然携带标准误；同日冲突证据改取中位数入分（与告警文案一致）
    - 维度聚合改可靠度加权（来源层级 × 时效衰减 × 一致性）；新增沿 归一化→维度→场景 逐层合成的 90% 误差界，页面与 API 全部展示「分数 ±区间」，区间重叠的相邻名次标记「≈ 并列」
    - 稀疏证据经验贝叶斯收缩：实体缺失的维度（全站有数据时）按先验 50±28.9 计入——修复单基准证据模型凭一条强数据以假满分登顶（旧算法 ide-coding/agent-coding/code-review/prototyping 的 TOP 即此假象）；全站无数据维度不参与评分，避免整体压缩
    - 置信度改 5 因子：覆盖率 × 来源层级 × 样本量 min(1,n/10) × 时效 1−0.2×(age/窗口) × 一致性；阈值调整为 高≥0.7 / 中≥0.4
    - 性价比分修复：只考虑有真实能力证据（非价格）的变体并改用实测适配分（不含先验收缩），此前纯价格证据变体以「先验 50 × 价格比上限 2」满分齐平、档位无信息量
    - Agent 通道：新增 /api/v1/{index,models,evidence,all}.json 与 /api/v1/scenarios/:id.json（静态 JSON、CORS 全开、自描述 schema_version/generated_at/data_as_of）+ /skill.md（agentskills.io 规范，场景清单构建时注入，源文件 skills/fitmodel-model-pick/SKILL.md）+ /api/ 文档页；llms.txt / llms-full.txt 增加通道索引与误差界
    - 一键同步：npm run sync（scripts/sync.mjs）= 鲜度巡检 + 白名单来源内容哈希变更检测（HTTP 源自动、JS 渲染源标记需浏览器）+ 采集任务卡（含写入模板，--json 供 agent 程序化消费）+ 排名影响对比（rank 快照存 scripts/.cache/，已 gitignore）；AGENTS.md 采集流程改以 sync 为入口并加「最小操作卡」
    - 页面改版：榜单页改为「综合能力指数（权重公示 40/30/20/10）+ 通用/编码/写作/长上下文分榜 + Agent 榜（仅展示）+ 原始镜像折叠」，全表带分数条与误差须；首页加综合榜 Top5 速览条、Agent 接入横幅、卡片内嵌适配分；场景页直接回答与排名表带误差界/并列标记及机器可读链接；模型页改综合+维度分列；方法页公式与行业对照重写
    - 排名影响（旧→新 TOP）：ide-coding/agent-coding/code-review claude-opus-4-5-high(100) → claude-opus-4-7-high(89.1–89.3)；prototyping claude-opus-4-5-high(100) → claude-opus-4-6-high(86.2)；spreadsheets claude-opus-4-5-high(100) → claude-fable-5(88.9)；其余 9 场景 TOP 保持 claude-fable-5 但分数由饱和 100.0 回落至 88.9–93.3；VALUE 由 gemini-3.1-pro-preview / claude-opus-4-6 等有据变体按场景区分（此前部分场景被纯价格变体占据）；FREE 档规则未动。场景权重与正文未动；构建校验通过
    - OG 分享图重生成（榜单/模型库文案更新）；check:freshness 全绿（仅 context_window_k 缺口，维持现状待人工）

- id: cl-2026-08-23-seo-geo-p1
  date: 2026-08-23
  title: SEO/GEO P1 增强：RSS、每页 OG 图、FAQ 结构化数据、llms-full.txt、IndexNow、搜索直达
  entries:
    - 新增 /rss.xml（@astrojs/rss，以 changelog 为数据源，条目带锚点直达对应日志）；全站 head 增加 RSS alternate 声明
    - 每页专属 OG 分享图：scripts/gen-og.mjs（HTML 模板 + Chrome 无头截图，零图像库依赖）生成 public/og/ 下 20 张 1200×630 PNG，各页 og:image / twitter:image 指向专属图并回退 og-default.png；场景标题变动后本地重跑脚本提交产物。方案中的 satori 构建时生成因 CJK 字体无法进 CI 而改用此法，效果等价
    - 场景页新增 FAQPage JSON-LD（3 个数据驱动问答：最强模型 / 免费工具 / 方法论，答案全部来自构建时计算输出，无手写结论）
    - 新增 /llms-full.txt 端点：13 个评分场景的完整排名（287 行，含维度权重、适配分、置信度、价格），构建时从数据生成；llms.txt 增加指向
    - IndexNow 主动推送：public/<key>.txt 验证文件 + deploy.yml 新增 notify-indexnow job（部署成功后向 api.indexnow.org 批量推送全部页面 URL，加速 Bing 等参与引擎收录；continue-on-error，不阻塞部署）
    - 首页搜索支持 ?q= 预填并自动出结果；WebSite schema 增加 SearchAction；changelog 条目渲染锚点 id（RSS 与深链直达）
    - 纯展示层与基建变更：evidence / 权重 / 场景正文未动，排名无变化；构建校验通过，21 页 + rss / llms / llms-full / sitemap / og 产物齐全

- id: cl-2026-08-22-seo-geo
  date: 2026-08-22
  title: SEO/GEO 基建上线：canonical、sitemap、robots.txt、JSON-LD、llms.txt 与 OG 分享卡
  entries:
    - 全站 head 完善（Base.astro）：canonical / og:url / og:type / og:site_name / og:locale / og:image / twitter:card 全套；trailingSlash 统一为 always 且站内链接统一带尾斜杠，消除双 URL 重复内容隐患
    - 新增 @astrojs/sitemap（产出 /sitemap-index.xml）与 public/robots.txt：全部搜索引擎与 AI 爬虫（GPTBot、ClaudeBot、PerplexityBot、Bytespider 等 16 个）明确允许，含训练用途，并声明 sitemap 地址
    - 新增 public/og-default.png（1200×630 品牌默认分享图，Chrome 无头渲染生成）与 404 页
    - JSON-LD：首页 WebSite + Organization；场景页 BreadcrumbList + Article + ItemList（排名取自构建时 rank() 输出，dateModified = 证据最新采集日）；榜单页与方法论页 Dataset（variableMeasured = 注册指标，citation = 来源 URL，license = CC BY 4.0）
    - GEO：新增 /llms.txt 端点（构建时从数据生成，含全部场景三档结论与数据截至日期，无手写内容）；场景页页首新增一句构建时生成的「直接回答」——数据驱动模板，非编辑观点，场景正文未动
    - 元数据：首页 title/description 显式定制（含「该用什么 AI」「证据驱动」核心词）；场景页 title 模板改为「{场景}用什么 AI？证据驱动的模型推荐 | FitModel」吃搜索意图；首页分类区块增加锚点 id（#cat-写作等）
    - 方案偏差记录：原方案（docs/seo-geo-plan.md）「draft 场景页 noindex 且不入 sitemap」暂不启用——当前 15 个场景全部为 draft（等首轮人工复审），启用会把全站核心内容排除出索引；待出现 verified 场景后再开启该规则
    - 纯展示层与基建变更：evidence / metrics / models / products / 权重 / 场景正文均未改动，排名无变化；构建校验通过

