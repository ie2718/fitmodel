# 更新日志

- id: cl-2026-08-22-home-cards
  date: 2026-08-22
  title: 首页速查表改版为「速查卡」目录式卡片
  entries:
    - 信息架构：15 行长表改为按 5 大类分组（写作/编程/研究/办公/创意）的卡片网格，桌面双列、移动端单列；每卡目录式序号 + 场景名 + 三档答案
    - 信息层级：每卡「最强」为 18px 加粗主答案（朱红方块标记），性价比/免费为细线分隔的两行次级信息（免费加绿方块）；暂不评分的场景用虚线边框卡片说明原因
