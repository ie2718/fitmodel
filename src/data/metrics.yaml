# 指标注册表：所有可入评分的指标必须先在此登记。
# 未登记的指标不得进入评分，只能作为文字信息展示（防止「幽灵数据」）。
#
# 字段说明：
# - dimension: 归属的能力维度（general/coding/writing/long_context/cost）
# - direction: higher=越高越好 / lower=越低越好
# - source_tier: 允许入分的最低来源层级（1=官方一手 2=独立基准 3=聚合二手）
# - freshness_days: 超过该天数的数据视为过期，只展示不入分
# - plausible: 取值合理域，域外视为采集错误，构建时报错
# - aggregator: 同一指标同一对象多条证据时的聚合方式（latest=取最新）

- id: arena_elo_overall
  label: Arena 总榜 Elo
  dimension: general
  unit: elo
  direction: higher
  source_tier: 2
  freshness_days: 90
  plausible: [800, 1700]
  aggregator: latest
  source: arena.ai（原 LMArena）人类盲测投票
  description: 真人盲测对比投票产生的 Elo 排名，反映综合人类偏好。

- id: arena_rank_overall
  label: Arena 总榜名次
  dimension: general
  unit: rank
  direction: lower
  source_tier: 2
  freshness_days: 90
  plausible: [1, 400]
  aggregator: latest
  source: arena.ai Text 总榜 Overall 名次
  description: Text 总榜 Overall 名次。arena 页面仅前 10 名展示 Elo 数值，11 名以后以名次入分；与 arena_elo_overall 构成通用维度的双信号。2026-09-05 经用户反馈确认新增（GPT 系列此前无法进入通用维度）。

