# 指标注册表：所有可入评分的指标必须先在此登记。
# 未登记的指标不得进入评分，只能作为文字信息展示（防止「幽灵数据」）。
#
# 字段说明：
# - dimension: 归属的能力维度（general/coding/writing/long_context/cost）
# - direction: higher=越高越好 / lower=越低越好
# - source_tier: 允许入分的最低来源层级（1=官方一手 2=独立基准 3=聚合二手）
# - freshness_days: 超过该天数的数据视为过期，只展示不入分
# - plausible: 取值合理域，域外视为采集错误，构建时报错
# - aggregator: 同一指标同一对象多条证据时的聚合方式（latest=取最新）
# - weight: 指标在所属维度内的相对权重（缺省 1.0）。维度聚合时与可靠度相乘构成证据话语权；
#   调整属算法层改动，需人工确认并同步方法论页 + docs/research-2026-09.md + changelog 留痕

